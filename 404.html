  <script>
    // Auto-redirect: send visitors from missing pages to the closest new page.
    // Links that look like an old page go there straight away;
    // anything else counts down and goes to the home page.
    (function () {
      var path = decodeURIComponent(location.pathname).toLowerCase()
        .replace(/^\/index\.php/, '').replace(/\.html?$/, '').replace(/\/+$/, '');
      if (path === '/404') return; // someone opened this page directly

      var rules = [
        [/about|welcome|who-we-are|founder|team/, '/about.html'],
        [/contact|enquir|quote|get-in-touch/, '/#contact'],
        [/service|business-admin|cipc|sars|csd|complian|labou?r|tax/, '/#services'],
        [/portfolio|project|web-design|website|logo|design|digital/, '/#digital']
      ];
      for (var i = 0; i < rules.length; i++) {
        if (rules[i][0].test(path)) { location.replace(rules[i][1]); return; }
      }

      var seconds = 5;
      var note = document.getElementById('nfRedirect');
      function tick() {
        note.textContent = 'Taking you to the home page in ' + seconds + ' second' + (seconds === 1 ? '' : 's') + '…';
        if (seconds-- <= 0) { location.replace('/'); return; }
        setTimeout(tick, 1000);
      }
      note.hidden = false;
      tick();
    })();
  </script>
